services:
  db:
    image: postgres:14-alpine
    container_name: vendor-system-db
    environment:
      POSTGRES_USER: vendor_admin
      POSTGRES_PASSWORD: vendor_secure_pass
      POSTGRES_DB: vendor_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vendor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendor_admin -d vendor_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:alpine
    container_name: vendor-system-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vendor-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vendor-system-api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: vendor_system
      DB_USER: vendor_admin
      DB_PASSWORD: vendor_secure_pass
      REDIS_HOST: cache
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - vendor-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  vendor-network:
    driver: bridge
